<!DOCTYPE html>
<html>

<head>

</head>

<body>
    <form>
        <div>
            <h1>Register</h1>
        </div>
        <div>
            <label for="userNameId">UserName</label>
            <span>*</span>
            <span>:</span>
            <input type="text" name="nameForUserName" id="userNameId" required>
        </div><br>
        <div>
            <label for="emailId">Email</label>
            <span>*</span>
            <span>:</span>
            <input type="email" name="nameForEmail" id="emailId" required>
        </div><br>
        <div>
            <label for="passwordId">Password</label>
            <span>*</span>
            <span>:</span>
            <input type="password" name="nameForPassword" id="passwordId" required>
        </div><br>
        <div>
            <label for="mobileNumberId">Mobile Number</label>
            <span>*</span>
            <span>:</span>
            <input type="tel" name="nameForMobileNumber" id="mobileNumberId">
        </div><br>
        <div>
            <label for="subjectId">Subject</label>
            <span>*</span>
            <span>:</span>
            <input type="text" name="nameForSubject" id="subjectId">
        </div><br>
        <div>
            <label>Preferred Contact</label>
            <span>*</span>
            <span>:</span>
            <input type="radio" name="contact"> Email
            <input type="radio" name="contact"> Phone
        </div><br>
        <div>
            <button>Submit</button>
            <button>Cancel</button>
        </div><br>
    </form>
</body>

</html>
