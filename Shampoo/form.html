<!DOCTYPE html>
<html>

<head>

</head>

<body>
    <form>
        <div>
            <h1>Place Order</h1>
        </div>
        <div>
            <label for="nameId">Name</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="text" name="nameForName" id="nameId" required>
        </div><br>
        <div>
            <label>Gender</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="checkbox" name="nameForGender" id="genderId" required>Male
            <input type="checkbox" name="nameForGender" id="genderId" required>Female
        </div><br>
        <div>
            <label for="emailId">Email</lable>
                <span style="color: darkred;">*</span>
                <span>:</span>
                <input type="email" name="nameForEmail" id="emailId" required>
        </div><br>
        <div>
            <label for="mobileNumberId">Mobile Number</b>
                <span style="color: darkred;">*</span>
                <span>:</span>
                <input type="tel" name="nameForMobileNumber" id="mobileNumberId" required>
        </div><br>
        <div>
            <label>Shampoo Type</b>
                <span style="color: darkred;">*</span>
                <span>:</span>
                <select>
                    <option>Herbal</option>
                    <option>Anti Dandruff</option>
                    <option>HairFall Control</option>
                </select>
        </div><br>
        <div>
            <label>Hair Type</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="radio" name="nameForhair" id="hairId" reqiured> Dry
            <input type="radio" name="nameForhair" id="hairId" required> Oily
            <input type="radio" name="nameForhair" id="hairId" required> Normal
        </div><br>
        <div>
            <label for="quantityId">Quantity</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="number" name="nameForQuantity" id="quantityId" required>
        </div><br>
        <div>
            <button>Confirm Order</button>
            <button>Cancel</button>
        </div>
    </form>
</body>

</html>
