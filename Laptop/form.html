<!DOCTYPE html>
<html>

<head>

</head>

<body>
    <form>
        <div>
            <h1>Place Order</h1>
        </div>
        <div>
            <label for="customerNameId">Customer Name</label>
            <span>*</span>
            <span>:</span>
            <input type="text" name="nameForCustomerName" id="customerNameId" required>
        </div><br>
        <div>
            <label for="emailId">Email</label>
            <span>*</span>
            <span style="color: darkred;">:</span>
            <input type="email" name="nameForEmail" id="emailId" required>
        </div><br>
        <div>
            <label for="mobileNumberId">Mobile Number</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="tel" name="nameForMobileNumber" id="mobileNumberId">
        </div><br>
        <div>
            <label for="addressId">Delivery Address</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="text" name="nameForAddress" id="addressId" required>
        </div><br>
        <div>
            <label>Laptop Brand</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <select>
            <option>Dell</option>
            <option>HP</option>
            <option>Lenovo</option>
            <option>Apple</option>
            </select>
        </div><br>
        <div>
            <label for="laptopModelId">Laptop model</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="text" name="nameForLaptopModel" id="laptopModelId">
        </div><br>
        <div>
            <label for="quanitityId">Quantity</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="number" name="nameForQuantity" id="quantityId">
        </div><br>
        <div>
            <button>Confirm</button>
            <button>Cancel</button>
        </div><br>
    </form>
</body>

</html>
