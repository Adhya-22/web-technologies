<!DOCTYPE html>
<html>

<head>

</head>

<body>
    <form>
        <div>
            <h1>Order Food</h1>
        </div>
        <div>
            <label>Name</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="text" name="nameForName" id="nameId" required>
        </div><br>
        <div>
            <label for="mobileNumberid">Mobile Number</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="tel" name="nameForMobileNumber" id="mobileNumberId" required>
        </div><br>
        <div>
            <label for="dishId">Dish</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <select>
                <option>Pizza</option>
                <option>Burger</option>
                <option>Pasta</option>
                <option>Fries</option>
            </select>
        </div><br>
        <div>
            <label for="quanitityId">Quantity</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="number" name="nameForQuantity" id="quantityId">
        </div><br>
        <div>
            <label for="orderType">Order Type</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="radio" name="order"> Dine-in
            <input type="radio" name="order"> Takeaway
            <input type="radio" name="order"> Delivery
        </div><br>
        <div>
            <label for="paymentId">Payment Type</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="checkbox"> Cash
            <input type="checkbox"> Card
            <input type="checkbox"> UPI
        </div><br>
        <div>
            <label>Delivery address</label>
            <span style="color: darkred;">*</span>
            <span>:</span>
            <input type="text" name="nameForAddress" id="addressId">
        </div><br>
        <div>
            <button>Submit</button>
            <button>Cancel</button>
        </div><br>
    </form>
</body>

</html>
